name: Health check

# Imports a test deck from each source that allows it and reads the last day's error and
# outcome counts (hosting/health.mjs). A failed run means something needs a look; the
# run's summary says what, and GitHub emails about the failure.
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check imports and counts
        run: node hosting/health.mjs
        env:
          # A read-only token: Account Analytics Read
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}

name: Refresh card data

on:
  schedule:
    # Refresh daily, away from the top of the hour when GitHub schedules are busiest.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-card-data
  cancel-in-progress: false

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The site and generated data are published from the default branch.
          ref: main
          # main requires the Tests checks, which a deploy key may bypass and the
          # workflow's own token can't. A push with it also runs Tests and Deploy site,
          # which a push with that token wouldn't.
          ssh-key: ${{ secrets.CARD_REFRESH_DEPLOY_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install minifier
        run: npm install --global terser@5

      - name: Download and generate card data
        run: ./generatecards.sh
        working-directory: js/cards

      - name: Validate card filtering
        run: python3 -m unittest discover --start-directory tests --pattern 'test_*.py'

      - name: Commit refreshed card data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh card data"
          branch: main
          file_pattern: js/cards/decklist-cards-min.js js/cards/decklist-cards-min.js.map

